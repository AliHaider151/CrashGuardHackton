[project]
name = "crashguard-camera-panel"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = [
    "Django==5.2.10",
    "gunicorn==23.0.0",
    "whitenoise==6.9.0",
    "cloudinary==1.44.1",
    "firebase-admin==7.1.0",
    "numpy==2.2.6",
    "opencv-python==4.12.0.88",
    "python-dotenv==1.2.1",
    "requests==2.32.5",
    "ultralytics==8.3.229",
    "torch==2.9.1+cpu",
    "torchvision==0.24.1+cpu",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch" }
torchvision = { index = "pytorch" }

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
